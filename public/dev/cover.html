<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>WordNerd cover</title>
  <!-- Developer tool: the 1200x630 cover (Hub product card, og:image). scripts/cover.mjs takes it with headless
       Chrome into public/og-image.png. -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: radial-gradient(circle at 18% 20%, rgb(255 180 74 / .16), transparent 45%),
        repeating-linear-gradient(0deg, rgb(255 255 255 / .015) 0 1px, transparent 1px 3px), var(--c-bg);
    }
    .frame { position: absolute; inset: 0; border: 14px solid #8a4f26; box-shadow: inset 0 0 0 3px #b57b5e; }
    .text { position: absolute; left: 80px; top: 120px; width: 600px; }
    .logo { width: 520px; height: auto; display: block; margin-bottom: 34px; }
    h1 { margin: 0 0 22px; font-size: 58px; color: #fff3d6; line-height: 1.08; }
    p { margin: 0; font-size: 26px; color: var(--c-text-muted); }
    .phone {
      position: absolute; width: 232px; aspect-ratio: 390 / 560; object-fit: cover; object-position: top;
      border-radius: 26px; border: 8px solid #17120d; box-shadow: 0 18px 40px rgb(0 0 0 / .55);
    }
    .back { left: 905px; top: 160px; transform: rotate(8deg); }
    .front { left: 720px; top: 138px; transform: rotate(-5deg); }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="text">
    <img class="logo" src="/img/brand/WordNerd_logo.png" alt="WordNerd">
    <h1>Vocabulary games from any text</h1>
    <p>Eight games for your class, played on their phones.</p>
  </div>
  <img class="phone back" src="/img/landing/hangman.webp" alt="">
  <img class="phone front" src="/img/landing/wordsearch.webp" alt="">
</body>
</html>
